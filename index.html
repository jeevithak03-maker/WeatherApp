<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>🌤️ Weather App</h1>

  <!-- Search & toggles -->
  <input type="text" id="cityInput" placeholder="Enter city name">
  <button id="searchBtn">Search</button>
  <button id="unitToggle">Switch to °F</button>
  <button id="modeToggle">🌙 Dark Mode</button>

  <!-- Favorites -->
  <div id="favoritesContainer" style="margin-top:20px;">
    <h3>⭐ Favorite Cities</h3>
    <div id="favoritesList"></div>
  </div>

  <!-- Weather display -->
  <div id="weatherResult" style="margin-top:20px;"></div>

  <script src="js/config.js"></script>
  <script src="js/weatherService.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
